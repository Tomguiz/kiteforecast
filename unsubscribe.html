<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<!-- Keep the token out of the Referer header sent to any resource this page loads. -->
<meta name="referrer" content="no-referrer"/>
<title>KiteForecast — Email preferences</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#111318;color:#e8eef5;font-family:'Poppins','Trebuchet MS',Verdana,sans-serif;padding:24px;}
  .card{max-width:460px;width:100%;background:#141b27;border:1px solid #1e2535;border-radius:14px;padding:32px;}
  h1{margin:0 0 12px;font-size:21px;line-height:1.3;color:#fff;}
  p{margin:0 0 16px;font-size:14px;line-height:1.65;color:#aab7c6;}
  .sub{font-size:12.5px;color:#8494a6;}
  strong{color:#e8eef5;}
  button{appearance:none;border:0;cursor:pointer;background:#0a7ac4;color:#fff;font:inherit;font-size:14.5px;
         font-weight:600;padding:13px 26px;border-radius:9px;}
  button:hover{background:#0968a8;}
  button[disabled]{opacity:.55;cursor:default;}
  a{color:#5dd4f0;text-decoration:none;font-size:13px;}
  a:hover{text-decoration:underline;}
  .brand{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#2a3347;margin:0 0 20px;}
</style>
</head>
<body>
<div class="card">
  <p class="brand">KITEFORECAST</p>
  <div id="view"><h1>One moment…</h1><p>Checking your email preferences.</p></div>
</div>

<script>
// This page is the *view* for the unsubscribe endpoint. Supabase Edge Functions
// cannot serve HTML — they rewrite text/html to text/plain — so the markup lives
// here on GitHub Pages and the function is a plain JSON API.
//
// Loading this page performs a GET, which only reads. The opt-out happens on the
// POST behind the button, so a mail scanner pre-fetching the link cannot
// unsubscribe anyone.
(function () {
  var FN = 'https://kpwmajtxmcfpakvonimf.supabase.co/functions/v1/unsubscribe';
  var APP = 'https://kiteforecast.app/';
  var view = document.getElementById('view');
  var token = new URLSearchParams(location.search).get('t') || '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function show(html) { view.innerHTML = html; }
  function settingsLink(label) {
    return '<p><a href="' + APP + '?tab=notifs">' + label + ' &rarr;</a></p>';
  }
  function invalid() {
    show('<h1>This link isn\'t valid</h1>' +
      '<p>It may have already been used, or the address was cut short by your email client &mdash; long links sometimes get wrapped onto two lines.</p>' +
      '<p class="sub">You can change every email setting from your profile in the app.</p>' +
      settingsLink('Open notification settings'));
  }
  function oops() {
    show('<h1>Something went wrong</h1><p>Try again in a moment.</p>' +
      settingsLink('Open notification settings'));
  }

  if (!token) { invalid(); return; }

  fetch(FN + '?t=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
    .then(function (res) {
      if (!res.ok) { invalid(); return; }
      var email = esc(res.body.email);

      if (res.body.already_unsubscribed) {
        show('<h1>You\'re already unsubscribed</h1>' +
          '<p>KiteForecast isn\'t sending emails to <strong>' + email + '</strong>.</p>' +
          '<p class="sub">Changed your mind? Turn them back on from your profile.</p>' +
          settingsLink('Open notification settings'));
        return;
      }

      show('<h1>Unsubscribe from KiteForecast emails?</h1>' +
        '<p>This stops every wind alert, reminder and weekly digest sent to <strong>' + email + '</strong>.</p>' +
        '<p><button id="go" type="button">Yes, unsubscribe me</button></p>' +
        '<p class="sub" style="margin-top:18px;">Would you rather keep the good bits? You can switch off individual alerts and keep the rest.</p>' +
        settingsLink('Choose which emails to keep'));

      document.getElementById('go').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Unsubscribing…';
        fetch(FN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: token }),
        })
          .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
          .then(function (res2) {
            if (!res2.ok || !res2.body.ok) { oops(); return; }
            show('<h1>Done &mdash; you\'re unsubscribed</h1>' +
              '<p>No more emails to <strong>' + esc(res2.body.email) + '</strong>. Sorry to see you go.</p>' +
              '<p class="sub">Your account and saved spots are untouched, and you can turn emails back on any time.</p>' +
              settingsLink('Open notification settings'));
          })
          .catch(oops);
      });
    })
    .catch(oops);
})();
</script>
</body>
</html>
