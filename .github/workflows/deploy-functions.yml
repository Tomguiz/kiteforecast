name: deploy-functions

# Edge functions were deployed by hand, which let a committed fix sit unshipped
# for weeks (the weekly-digest override-dirs fix: committed 2026-07-10 17:44 UTC,
# deployed version still dated 17:16 UTC). Deploy on every push to main instead.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: kpwmajtxmcfpakvonimf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. With `latest` the action resolves the release
          # through an unauthenticated GitHub API call on every run, and that
          # call is rate-limited — on 2026-08-16 it failed in 6 seconds and the
          # PR #29 merge never deployed. The failure is silent unless someone
          # reads the notification email. Bump this deliberately.
          version: 2.114.0

      - name: Verify credentials are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings > Secrets > Actions."
            exit 1
          fi

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
